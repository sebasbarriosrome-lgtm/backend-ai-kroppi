unit: samples
bindings:
  - type: route-declaration
    name: "POST /plots/{plot_id}/samples"
    source_loc: "app/routers/samples.py:10"
    target: "crear_muestreo"
    must_appear_in_target: true
    notes: "Persists a plot sample and updates the parent plot status."
  - type: route-declaration
    name: "GET /plots/{plot_id}/samples"
    source_loc: "app/routers/samples.py:15"
    target: "historial_muestreos"
    must_appear_in_target: true
    notes: "Reads the most recent samples for a plot."
  - type: filter
    name: "Depends(usuario_actual)"
    source_loc: "app/routers/samples.py:11"
    target: "crear_muestreo"
    must_appear_in_target: true
    notes: "Requires the authenticated user identity for all sample operations."
runtime_config:
  - key: SUPABASE_URL
    source_loc: "app/config/settings.py:6"
    source: env
    default_value: "required"
    must_appear_in_target: true
    notes: "Supabase backend target for sample retrieval and persistence."
  - key: SUPABASE_SERVICE_ROLE_KEY
    source_loc: "app/config/settings.py:7"
    source: env
    default_value: "required"
    must_appear_in_target: true
    notes: "Service credential used by server-side repository calls."
